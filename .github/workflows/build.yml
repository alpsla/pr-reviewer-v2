name: Build and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7  # Adjust this to your desired pnpm version
      - name: Verify pnpm installation
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build