name: Build and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pnpm globally
        run: npm install -g pnpm@10.6.3
      - name: Verify pnpm installation
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: npm run build
