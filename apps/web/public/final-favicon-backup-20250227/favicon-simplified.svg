<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Solid blue background for better visibility -->
  <rect x="0" y="0" width="100" height="100" fill="#2563eb" rx="10" ry="10" />
  
  <!-- Simple white shield outline -->
  <path 
    d="M50 20 L75 30 L75 55 Q75 70 50 80 Q25 70 25 55 L25 30 Z" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="5" 
  />
  
  <!-- Checkmark - simplified and moved up for visibility -->
  <path 
    d="M65 45 L50 60 L35 45" 
    fill="none"
    stroke="#ffffff" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>