<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Two-tone background -->
  <path 
    d="M0 0 L100 0 L100 100 L0 100 Z" 
    fill="#2563eb" 
  />
  
  <!-- Single large code bracket for instant recognition -->
  <path 
    d="M30 25 C20 40, 20 60, 30 75 M70 25 C80 40, 80 60, 70 75" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Simple checkmark -->
  <path 
    d="M30 50 L45 65 L70 40" 
    fill="none"
    stroke="#00e676" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>